<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — FreeEdu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080808; --accent: #6366f1; --accent-dim: rgba(99,102,241,0.15);
    --accent-border: rgba(99,102,241,0.35); --text-primary: #f0f0f0;
    --text-secondary: #888; --text-muted: #444;
    --font-display: 'Syne', sans-serif; --font-body: 'DM Sans', sans-serif;
    --radius-md: 12px; --transition: 200ms ease;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-body); background: var(--bg); color: var(--text-primary);
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 20px; text-align: center;
  }
  .code {
    font-family: var(--font-display); font-size: clamp(80px, 18vw, 140px); font-weight: 800;
    line-height: 1; letter-spacing: -4px; color: transparent;
    -webkit-text-stroke: 2px rgba(99,102,241,0.3);
    margin-bottom: 8px;
    background: linear-gradient(135deg, rgba(99,102,241,0.6) 0%, rgba(99,102,241,0.1) 100%);
    -webkit-background-clip: text; background-clip: text;
  }
  h1 { font-family: var(--font-display); font-size: 22px; font-weight: 700; margin-bottom: 10px; }
  p { font-size: 14px; color: var(--text-secondary); max-width: 320px; line-height: 1.6; margin-bottom: 28px; }
  .btn-group { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 10px 20px; border-radius: var(--radius-md);
    font-family: var(--font-body); font-size: 14px; font-weight: 500;
    text-decoration: none; cursor: pointer; transition: all var(--transition);
  }
  .btn-primary { background: var(--accent-dim); border: 1px solid var(--accent-border); color: var(--accent); }
  .btn-primary:hover { background: rgba(99,102,241,0.25); }
  .btn-secondary { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); color: var(--text-secondary); }
  .btn-secondary:hover { border-color: rgba(255,255,255,0.14); color: var(--text-primary); }
  .btn svg { width: 15px; height: 15px; }
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(99,102,241,0.4); margin: 24px auto 0;
    animation: pulse 2s ease infinite;
  }
  @keyframes pulse { 0%,100%{opacity:0.4;transform:scale(1)} 50%{opacity:1;transform:scale(1.4)} }
</style>
</head>
<body>
<div class="code">404</div>
<h1>Page Not Found</h1>
<p>This page doesn't exist or may have been moved. Head back to the library to find what you need.</p>
<div class="btn-group">
  <a class="btn btn-primary" href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>
    Go to Library
  </a>
  <a class="btn btn-secondary" href="admin.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
    Admin Panel
  </a>
</div>
<div class="dot"></div>
</body>
</html>
