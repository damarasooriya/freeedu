<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch — FreeEdu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080808;
    --bg-surface: #111111;
    --bg-card: #161616;
    --bg-elevated: #1e1e1e;
    --accent: #6366f1;
    --accent-dim: rgba(99,102,241,0.15);
    --accent-border: rgba(99,102,241,0.35);
    --text-primary: #f0f0f0;
    --text-secondary: #888888;
    --text-muted: #555555;
    --border: rgba(255,255,255,0.06);
    --border-hover: rgba(255,255,255,0.12);
    --success: #22c55e;
    --telegram: #229ED9;
    --font-display: 'Syne', sans-serif;
    --font-body: 'DM Sans', sans-serif;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --transition: 200ms ease;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: 99px; }

  /* NAV */
  .nav {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(8,8,8,0.88);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 14px 28px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .back-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-secondary);
    font-family: var(--font-body);
    font-size: 13px;
    padding: 6px 12px;
    cursor: pointer;
    text-decoration: none;
    transition: all var(--transition);
  }
  .back-btn:hover { border-color: var(--border-hover); color: var(--text-primary); }
  .back-btn svg { width: 14px; height: 14px; }
  .nav-logo {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 16px;
    color: var(--text-primary);
    text-decoration: none;
    letter-spacing: -0.3px;
  }
  .nav-logo span { color: var(--accent); }
  .nav-breadcrumb {
    font-size: 13px;
    color: var(--text-muted);
    margin-left: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* LAYOUT */
  .watch-layout {
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 24px;
    padding: 28px;
    max-width: 1400px;
    margin: 0 auto;
    width: 100%;
    flex: 1;
  }

  /* PLAYER COLUMN */
  .player-col {}
  .player-wrap {
    position: relative;
    aspect-ratio: 16/9;
    background: #000;
    border-radius: var(--radius-lg);
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .player-wrap iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }
  .player-not-found {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    height: 100%;
    color: var(--text-muted);
  }
  .player-not-found svg { width: 48px; height: 48px; }
  .player-not-found h3 { font-size: 16px; color: var(--text-secondary); }
  .player-not-found p { font-size: 13px; max-width: 260px; text-align: center; }

  .video-info { margin-top: 20px; }
  .video-info-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }
  .video-info-title {
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 700;
    color: var(--text-primary);
    line-height: 1.35;
    letter-spacing: -0.3px;
    flex: 1;
  }
  .external-link-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    background: var(--accent-dim);
    border: 1px solid var(--accent-border);
    border-radius: var(--radius-sm);
    color: var(--accent);
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 500;
    text-decoration: none;
    cursor: pointer;
    white-space: nowrap;
    transition: background var(--transition);
    flex-shrink: 0;
  }
  .external-link-btn:hover { background: rgba(99,102,241,0.25); }
  .external-link-btn svg { width: 13px; height: 13px; }

  .video-meta-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
    padding: 14px 0;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    margin-bottom: 14px;
  }
  .meta-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--text-secondary);
  }
  .meta-item svg { width: 14px; height: 14px; color: var(--text-muted); }
  .subject-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    border-radius: 99px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.4px;
    border: 1px solid;
  }
  .source-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 10px;
    border-radius: 99px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .source-pill.youtube { background: rgba(255,0,0,0.12); color: #ff4444; border: 1px solid rgba(255,0,0,0.3); }
  .source-pill.telegram { background: rgba(34,158,217,0.12); color: var(--telegram); border: 1px solid rgba(34,158,217,0.3); }

  .tg-warning {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 12px 16px;
    background: rgba(34,158,217,0.07);
    border: 1px solid rgba(34,158,217,0.2);
    border-radius: var(--radius-md);
    margin-top: 16px;
  }
  .tg-warning svg { width: 16px; height: 16px; color: var(--telegram); flex-shrink: 0; margin-top: 1px; }
  .tg-warning p { font-size: 13px; color: var(--text-secondary); line-height: 1.55; }
  .tg-warning a { color: var(--telegram); text-decoration: none; }
  .tg-warning a:hover { text-decoration: underline; }

  /* SIDEBAR COLUMN */
  .sidebar-col {}
  .sidebar-col-title {
    font-family: var(--font-display);
    font-size: 14px;
    font-weight: 700;
    color: var(--text-secondary);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  .related-list { display: flex; flex-direction: column; gap: 10px; }
  .related-card {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    overflow: hidden;
    cursor: pointer;
    text-decoration: none;
    transition: border-color var(--transition), background var(--transition);
  }
  .related-card:hover { border-color: var(--border-hover); background: #1c1c1c; }
  .related-card.active-card { border-color: var(--accent-border); background: var(--accent-dim); }
  .related-thumb {
    width: 100px;
    min-width: 100px;
    aspect-ratio: 16/9;
    background: var(--bg-elevated);
    overflow: hidden;
    position: relative;
  }
  .related-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .related-thumb-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .related-thumb-placeholder svg { width: 18px; height: 18px; color: var(--text-muted); }
  .related-info { padding: 8px 10px 8px 0; flex: 1; min-width: 0; }
  .related-subject {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    margin-bottom: 3px;
  }
  .related-title {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-primary);
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 4px;
  }
  .related-meta { font-size: 11px; color: var(--text-muted); }

  /* NOT FOUND */
  .not-found-page {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    gap: 14px;
    text-align: center;
    padding: 40px 20px;
  }
  .not-found-page svg { width: 56px; height: 56px; color: var(--text-muted); }
  .not-found-page h2 { font-family: var(--font-display); font-size: 20px; color: var(--text-secondary); }
  .not-found-page p { font-size: 14px; color: var(--text-muted); max-width: 300px; }
  .home-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 10px 20px;
    background: var(--accent-dim);
    border: 1px solid var(--accent-border);
    border-radius: var(--radius-md);
    color: var(--accent);
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    cursor: pointer;
    margin-top: 8px;
    transition: background var(--transition);
  }
  .home-btn:hover { background: rgba(99,102,241,0.25); }
  .home-btn svg { width: 15px; height: 15px; }

  @media (max-width: 900px) {
    .watch-layout { grid-template-columns: 1fr; }
    .sidebar-col { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 0; }
    .related-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  }
  @media (max-width: 600px) {
    .nav { padding: 12px 16px; }
    .watch-layout { padding: 16px; gap: 16px; }
    .video-info-title { font-size: 16px; }
    .nav-breadcrumb { display: none; }
    .video-info-top { flex-direction: column; gap: 10px; }
    .external-link-btn { align-self: flex-start; }
  }
</style>
</head>
<body>

<nav class="nav">
  <a class="back-btn" href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12,19 5,12 12,5"/>
    </svg>
    Back
  </a>
  <a class="nav-logo" href="index.html">Study<span>Vault</span></a>
  <span class="nav-breadcrumb" id="navBreadcrumb">Loading…</span>
</nav>

<div id="mainContent"></div>

<script>
const STORAGE_KEY = 'freeedu_videos_v1';

function loadVideos() {
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    if (s) {
      const p = JSON.parse(s);
      if (p && Array.isArray(p.videos)) return p.videos;
    }
  } catch(e) {}
  return [];
}

function getSubjectColor(subject) {
  const c = {
    'biology':'#22c55e','chemistry':'#f59e0b','physics':'#3b82f6',
    'mathematics':'#8b5cf6','math':'#8b5cf6','maths':'#8b5cf6',
    'english':'#ec4899','english literature':'#ec4899',
    'economics':'#14b8a6','history':'#f97316','geography':'#10b981',
    'computer science':'#6366f1','psychology':'#e879f9','sociology':'#fb923c'
  };
  return c[(subject||'').toLowerCase()] || '#6366f1';
}

function getYTThumb(id) { return `https://img.youtube.com/vi/${id}/mqdefault.jpg`; }

function formatDate(ts) {
  const d = new Date(ts), now = new Date();
  const diff = Math.floor((now - d) / 1000);
  if (diff < 60) return 'Just now';
  if (diff < 3600) return Math.floor(diff/60) + 'm ago';
  if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
  if (diff < 604800) return Math.floor(diff/86400) + 'd ago';
  return d.toLocaleDateString('en-GB', {day:'numeric',month:'short'});
}

function extractTelegramInfo(url) {
  if (!url) return null;
  const m = url.match(/t\.me\/([^\/]+)\/(\d+)/);
  return m ? { channel: m[1], msgId: m[2] } : null;
}

function init() {
  const params = new URLSearchParams(window.location.search);
  const videoId = params.get('v');
  const videos = loadVideos();
  const main = document.getElementById('mainContent');

  if (!videoId) {
    renderNotFound(main, 'No video specified');
    return;
  }

  const video = videos.find(v => v.id === videoId);
  if (!video) {
    renderNotFound(main, 'Video not found. It may have been deleted.');
    return;
  }

  document.title = `${video.title} — FreeEdu`;
  document.getElementById('navBreadcrumb').textContent = `${video.subject || ''} › ${video.title}`;

  const related = videos
    .filter(v => v.id !== video.id && (v.subject === video.subject || v.topic === video.topic))
    .slice(0, 8);

  const color = getSubjectColor(video.subject);
  const isYT = video.source === 'youtube';
  const tgInfo = !isYT ? extractTelegramInfo(video.url) : null;

  let playerHTML = '';
  if (isYT && video.videoId) {
    playerHTML = `<iframe src="https://www.youtube.com/embed/${video.videoId}?autoplay=1&rel=0&modestbranding=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen title="${video.title}"></iframe>`;
  } else if (tgInfo) {
    playerHTML = `<iframe src="https://t.me/${tgInfo.channel}/${tgInfo.msgId}?embed=1&mode=tme" allowfullscreen allow="encrypted-media" sandbox="allow-same-origin allow-scripts allow-popups" title="${video.title}"></iframe>`;
  } else {
    playerHTML = `<div class="player-not-found">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="5,3 19,12 5,21"/></svg>
      <h3>Cannot embed this video</h3>
      <p>This video type cannot be embedded here.</p>
    </div>`;
  }

  const relatedHTML = related.length > 0 ? related.map(v => {
    const rc = getSubjectColor(v.subject);
    let thumbInner = '';
    if (v.source === 'youtube' && v.videoId) {
      thumbInner = `<img src="${getYTThumb(v.videoId)}" alt="${v.title}" loading="lazy" onerror="this.style.display='none'">`;
    } else {
      thumbInner = `<div class="related-thumb-placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="5,3 19,12 5,21"/></svg></div>`;
    }
    return `
      <a class="related-card" href="watch.html?v=${v.id}">
        <div class="related-thumb">${thumbInner}</div>
        <div class="related-info">
          <div class="related-subject" style="color:${rc}">${v.subject || ''}</div>
          <div class="related-title">${v.title}</div>
          <div class="related-meta">${v.duration ? v.duration + ' · ' : ''}${formatDate(v.addedAt)}</div>
        </div>
      </a>
    `;
  }).join('') : `<p style="font-size:13px;color:var(--text-muted);">No related videos found in the library.</p>`;

  main.innerHTML = `
    <div class="watch-layout">
      <div class="player-col">
        <div class="player-wrap">${playerHTML}</div>
        <div class="video-info">
          <div class="video-info-top">
            <h1 class="video-info-title">${video.title}</h1>
            <a class="external-link-btn" href="${video.url}" target="_blank" rel="noopener">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15,3 21,3 21,9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
              Open Original
            </a>
          </div>
          <div class="video-meta-row">
            <span class="subject-pill" style="color:${color};border-color:${color}30;background:${color}12">${video.subject || 'Uncategorised'}</span>
            <span class="source-pill ${video.source}">${video.source === 'youtube' ? 'YouTube' : 'Telegram'}</span>
            ${video.topic ? `<span class="meta-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>${video.topic}</span>` : ''}
            ${video.channel ? `<span class="meta-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>${video.channel}</span>` : ''}
            ${video.duration ? `<span class="meta-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12,6 12,12 16,14"/></svg>${video.duration}</span>` : ''}
            <span class="meta-item" style="margin-left:auto;font-size:11px;color:var(--text-muted)">Added ${formatDate(video.addedAt)}</span>
          </div>
          ${!isYT ? `<div class="tg-warning">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.6 0 12 0zm5.9 8.2l-2 9.5c-.1.7-.6.9-1.1.5l-3-2.3-1.5 1.4c-.2.2-.4.3-.7.3l.3-3.1 6.1-5.5c.3-.2-.1-.3-.4-.2L6.7 13.6 3.8 12.7c-.7-.2-.7-.7.1-1l11.5-4.4c.6-.2 1.2.1 1 .9h-.5z"/></svg>
            <p>This is a Telegram video. If it doesn't load correctly, <a href="${video.url}" target="_blank" rel="noopener">open it directly in Telegram →</a></p>
          </div>` : ''}
        </div>
      </div>
      <div class="sidebar-col">
        <div class="sidebar-col-title">Up Next</div>
        <div class="related-list">${relatedHTML}</div>
      </div>
    </div>
  `;
}

function renderNotFound(container, msg) {
  document.getElementById('navBreadcrumb').textContent = 'Not Found';
  container.innerHTML = `
    <div class="not-found-page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <h2>Video Not Found</h2>
      <p>${msg}</p>
      <a class="home-btn" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>
        Back to Library
      </a>
    </div>
  `;
}

init();
</script>
</body>
</html>
